server:
  port: 8080

# ──────────────────────────────────────────────
# PostgreSQL + PostGIS Datasource
# ──────────────────────────────────────────────
spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:flooddb}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver

    # HikariCP Connection Pool
    hikari:
      maximum-pool-size: 15
      minimum-idle: 5
      idle-timeout: 300000          # 5 minutes
      max-lifetime: 1800000         # 30 minutes
      connection-timeout: 20000     # 20 seconds
      leak-detection-threshold: 30000  # 30 seconds — logs a warning for unreturned connections
      pool-name: FloodDB-HikariPool

  # ──────────────────────────────────────────────
  # JPA / Hibernate
  # ──────────────────────────────────────────────
  jpa:
    open-in-view: false             # Prevents lazy-loading anti-pattern in controllers
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update              # Switch to 'validate' + Flyway in production
    properties:
      hibernate:
        format_sql: false
        jdbc:
          batch_size: 25            # Batched inserts/updates
        order_inserts: true
        order_updates: true
    show-sql: false

  # ──────────────────────────────────────────────
  # Kafka
  # ──────────────────────────────────────────────
  kafka:
    bootstrap-servers: ${KAFKA_SERVERS:localhost:9092}
    producer:
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: sos-routing-group
      auto-offset-reset: earliest
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"

  # ──────────────────────────────────────────────
  # Redis
  # ──────────────────────────────────────────────
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

# ──────────────────────────────────────────────
# Application Custom Properties
# ──────────────────────────────────────────────
jwt:
  secret: ${JWT_SECRET:9a2f8c7d6e5b4a3f2e1d0c9b8a7f6e5d4c3b2a1f0e9d8c7b6a5f4e3d2c1b0a9f}
  expiration:
    ms: 86400000

ml:
  service:
    url: ${ML_SERVICE_URL:http://localhost:8001}

web3:
  node-url: ${WEB3_NODE_URL:https://sepolia.infura.io/v3/YOUR_INFURA_PROJECT_ID}
  private-key: ${WEB3_PRIVATE_KEY:0x4c0883a69102937d6231471b5dbb6204f29139fa314087380f13540000000000}
  contract-address: ${WEB3_CONTRACT_ADDRESS:0x0000000000000000000000000000000000000000}

# ──────────────────────────────────────────────
# Actuator & Prometheus Metrics Configuration
# ──────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
    prometheus:
      enabled: true
  metrics:
    tags:
      application: flood-risk-platform
