global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'spring-boot-backend'
    metrics_path: '/actuator/prometheus'
    scrape_interval: 5s
    static_configs:
      - targets: ['host.docker.internal:8080']
        labels:
          application: 'flood-management-api'

  - job_name: 'fastapi-ml-service'
    scrape_interval: 10s
    static_configs:
      - targets: ['host.docker.internal:8001']
        labels:
          application: 'flood-ml-microservice'
